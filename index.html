<style>
:root{--bg:#f7f4ec;--ink:#303a29;--text:#464c41;--gold:#937042;--line:#c9c4b5;--card:#fffdf8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:18px/1.7 Manrope,Arial,sans-serif}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;color:var(--ink);font-weight:500;line-height:1.2;overflow-wrap:normal;word-break:normal;hyphens:none}
h1{font-size:clamp(52px,10vw,100px);line-height:1.07;margin:24px 0}h2{font-size:clamp(34px,6vw,58px);margin:12px 0 20px}h3{font-size:27px;margin:22px 0 9px}
p{margin:0 0 18px}strong{color:var(--ink)}a{color:inherit}.wrap{width:min(1040px,calc(100% - 40px));margin:auto}
.eyebrow{font-size:13px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.hero{padding:100px 0 85px;min-height:76vh;background:radial-gradient(ellipse at 90% 15%,#e1e6d8,transparent 50%),var(--bg);border-bottom:1px solid var(--line)}
.hero em{color:#71805c}.lead{font-size:clamp(20px,3vw,26px);line-height:1.55;max-width:680px}.tag{display:inline-block;border:1px solid #aaa48e;border-radius:30px;padding:5px 15px;margin:8px 9px 20px 0;font-size:14px}
.btn{display:inline-block;border-radius:40px;background:var(--ink);color:white;text-decoration:none;padding:12px 22px;font-size:15px;font-weight:700}
.toc{padding:75px 0}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:30px}
.nav a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;text-decoration:none;font-size:16px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:10px}
.nav a:hover{background:#e8ebdf}.nav a span{color:var(--gold)}
.section{padding:65px 0;border-top:1px solid var(--line);scroll-margin-top:15px}.section:nth-child(even){background:#f1f0e7}
.head{display:flex;gap:16px;align-items:flex-start}.head h2{flex:1;min-width:0}.toggle{margin-top:14px;flex-shrink:0;border:1px solid var(--line);background:var(--card);color:var(--ink);width:42px;height:42px;border-radius:50%;font-size:23px;cursor:pointer}
.teaser{font-size:19px;max-width:770px}.read{background:none;border:0;color:var(--ink);font:700 16px Manrope;cursor:pointer;padding:12px 0;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:6px}
.detail{display:none;padding-top:25px}.section.open .detail{display:block}.grid{display:grid;grid-template-columns:1.3fr .85fr;gap:38px;align-items:start}
.grid img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:150px 150px 12px 12px;background:#e5e7da}
.note{padding:20px 24px;background:#e8ebdf;border-left:3px solid #83916c;border-radius:0 8px 8px 0;margin:24px 0}
li{margin-bottom:9px}.back{display:inline-block;margin-top:28px;color:var(--gold);font-weight:700;font-size:15px;text-decoration:none}
.quote{padding:90px 0;text-align:center;background:var(--ink);color:#f7f4ec}.quote h2{color:#f7f4ec;max-width:850px;margin:20px auto 25px}.quote .eyebrow{color:#d6b786}
footer{padding:35px 0;font-size:14px}footer button{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:9px 16px;color:var(--ink);cursor:pointer}
@media(max-width:650px){body{font-size:18px}.wrap{width:calc(100% - 36px)}.hero{min-height:0;padding:90px 0 65px}.toc{padding:55px 0}.nav{grid-template-columns:1fr}.section{padding:48px 0}.head h2{font-size:clamp(32px,8.2vw,44px)}.toggle{width:38px;height:38px;margin-top:9px}.grid{grid-template-columns:1fr}.grid img{max-height:340px;aspect-ratio:5/4}.teaser{font-size:18px}}
@media print{.hero{min-height:0;padding:20px 0}.toc,.toggle,.read,.back,footer button{display:none!important}.detail{display:block!important}.grid{display:block}.grid img{display:none}.section{padding:20px 0;break-inside:avoid}.quote{background:white;color:black}.quote h2{color:black}body{font-size:12pt}h2{font-size:24pt}}

/* Native disclosures work even when JavaScript is blocked by a preview */
.disclosure>summary{display:flex;align-items:flex-start;gap:16px;cursor:pointer;list-style:none}.disclosure>summary::-webkit-details-marker{display:none}.disclosure>summary h2{flex:1;min-width:0}.disclosure .chevron{flex:0 0 42px;height:42px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:50%;display:grid;place-items:center;font-size:24px;margin-top:14px}.disclosure[open] .chevron{transform:rotate(180deg)}.disclosure .teaser{margin-bottom:0}.disclosure .detail{display:none}.disclosure[open] .detail{display:block}.disclosure:not([open]) .teaser{padding-bottom:8px}.disclosure>summary:focus-visible{outline:2px solid var(--gold)}@media(max-width:650px){.disclosure>summary{gap:10px}.disclosure .chevron{flex-basis:38px;height:38px;margin-top:9px}}@media print{.disclosure .detail{display:block!important}.disclosure .chevron{display:none}}

<script>(function(){
addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__bip=e});
var K='gift-pw',f=document.querySelector('#lock form'),pw=document.getElementById('pw'),err=document.getElementById('err');
var raw=Uint8Array.from(atob(document.getElementById('payload').textContent.trim()),function(c){return c.charCodeAt(0)});
function unlock(p){var e=new TextEncoder();
return crypto.subtle.importKey('raw',e.encode(p),'PBKDF2',false,['deriveKey']).then(function(b){
return crypto.subtle.deriveKey({name:'PBKDF2',salt:raw.slice(0,16),iterations:310000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt'])}).then(function(k){
return crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},k,raw.slice(28))}).then(function(d){
document.body.innerHTML=new TextDecoder().decode(d);
document.body.querySelectorAll('script').forEach(function(o){var s=document.createElement('script');s.textContent=o.textContent;o.replaceWith(s)});
if(location.hash){var t=document.querySelector(location.hash);if(t){var dd=t.querySelector('details');if(dd)dd.open=true;t.scrollIntoView()}}
try{localStorage.setItem(K,p)}catch(x){}})}
f.addEventListener('submit',function(e){e.preventDefault();err.textContent='';
unlock(pw.value).catch(function(){err.textContent='Неверный пароль';pw.select()})});
var saved=null;try{saved=localStorage.getItem(K)}catch(x){}
if(saved)unlock(saved).catch(function(){try{localStorage.removeItem(K)}catch(x){}});
})();</script>
